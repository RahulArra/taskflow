services:
  mongo:
    image: mongo:8
    container_name: taskflow-mongo
    restart: unless-stopped
    volumes:
      - taskflow-mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: rahularra/taskflow-backend:v2
    container_name: taskflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/taskflow
      FRONTEND_ORIGIN: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: rahularra/taskflow-frontend:v1
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  taskflow-mongo-data:
    name: taskflow-mongo-data